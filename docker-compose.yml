# NOT run in the authoring environment - verify with:  docker compose up --build
services:
  studio:
    build: .
    ports:
      - "127.0.0.1:8765:8765"     # published to localhost only (the app has no login)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
